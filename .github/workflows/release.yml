# Builds a release for every pushed tag `vX.Y.Z` and publishes it on the
# repository's Releases page, where the app looks for updates.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_DEBUG_KEYSTORE  base64 of the keystore that signed the APKs
#                           already installed (~/.android/debug.keystore on
#                           the machine that built them). Android installs
#                           an update only over the same signature.
#   SHIKIMORI_CONFIG        the contents of config/shikimori.json; without
#                           it the build runs with sign-in not set up.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.4'
  # SHA-256 of the certificate in ANDROID_DEBUG_KEYSTORE. Public: every APK
  # carries it. An APK signed with anything else does not install over the
  # current one, so the release stops before it is published.
  ANDROID_CERT_SHA256: 00d5eca0bb73210f8b65095ce62ccfd2cc83d5af6b8a2b1b5feb73026dd5e492

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE is not set: the APK would not install over the current one."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          # Where the Android Gradle plugin looks for the debug keystore;
          # without it the runner's own location may win and a fresh key
          # gets generated there.
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$HOME/.android/debug.keystore"             -storepass android -alias androiddebugkey | grep 'SHA256:'
      - name: Shikimori config
        env:
          CONFIG: ${{ secrets.SHIKIMORI_CONFIG }}
        run: |
          if [ -n "$CONFIG" ]; then
            printf '%s' "$CONFIG" > config/shikimori.json
          else
            cp config/shikimori.example.json config/shikimori.json
          fi
      - run: flutter pub get
      - name: Build APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARGS=(--release --build-name="$VERSION"
                --build-number="${{ github.run_number }}"
                --dart-define-from-file=config/shikimori.json)
          mkdir -p dist
          # An APK per ABI, so a device fetches only its own, and a universal
          # one for whoever does not know which they need. All four share a
          # version code, so any of them installs over another.
          flutter build apk "${ARGS[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/iris-$VERSION-android-universal.apk"
          flutter build apk "${ARGS[@]}" --split-per-abi \
            -P force-version-code-ignoring-abi=true
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$ABI-release.apk" \
              "dist/iris-$VERSION-android-$ABI.apk"
          done
      - name: Check the signatures
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in dist/*.apk; do
            CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
            echo "$APK: $CERTS"
            if ! grep -q "SHA-256 digest: $ANDROID_CERT_SHA256" <<< "$CERTS"; then
              echo "::error::$APK is not signed with the key of the installed builds."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Shikimori config
        shell: bash
        env:
          CONFIG: ${{ secrets.SHIKIMORI_CONFIG }}
        run: |
          if [ -n "$CONFIG" ]; then
            printf '%s' "$CONFIG" > config/shikimori.json
          else
            cp config/shikimori.example.json config/shikimori.json
          fi
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build windows --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define-from-file=config/shikimori.json
      - name: Pack
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/iris-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The arm64 APK goes up first: builds before 1.1.1 take a
          # release's first APK as theirs.
          gh release create "$GITHUB_REF_NAME" dist/*-android-arm64-v8a.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
          for FILE in dist/*; do
            case "$FILE" in *-android-arm64-v8a.apk) continue ;; esac
            gh release upload "$GITHUB_REF_NAME" "$FILE" --repo "$GITHUB_REPOSITORY"
          done
